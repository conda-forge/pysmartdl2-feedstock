schema_version: 1

context:
  name: pysmartdl2
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pysmartdl2-${{ version }}.tar.gz
  sha256: 0e336d15724a8d000ea8a55c43ceabfa3e8f795e5e0d2112f98c85810a227eb6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pysmartdl2
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Modernized fork of the Smart Download Manager for Python by iTaybb with CI testing matrix and other 2024 bells and whistles.
  license: Unlicense
  license_file: LICENSE.txt
  homepage: https://github.com/amkrajewski/pysmartdl2

extra:
  recipe-maintainers:
    - jan-janssen
